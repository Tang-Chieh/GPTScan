name: Fork tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.2 pydantic==2.12.3
      - run: python -m unittest discover -s tests -v
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-fork.txt
      - name: Install official Solidity compiler (avoid external binary-list service)
        run: |
          mkdir -p .venv/.solc-select/artifacts/solc-0.8.19
          curl -Lf --retry 2 https://github.com/ethereum/solidity/releases/download/v0.8.19/solc-static-linux -o .venv/.solc-select/artifacts/solc-0.8.19/solc-0.8.19
          chmod +x .venv/.solc-select/artifacts/solc-0.8.19/solc-0.8.19
      - run: .venv/bin/python tests/runtime_smoke.py
      - run: .venv/bin/python tests/runtime_archive_smoke.py
