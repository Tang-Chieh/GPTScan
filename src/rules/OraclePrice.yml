name: oracle-price-manipulation
property:
  - derive a price, exchange rate or asset valuation from DEX spot state, reserves, token balances or other attacker-influenceable protocol state
  - and use that value for borrowing, minting, redeeming, withdrawing, liquidation, swaps or reward calculation without sufficient independent or time-weighted price validation
function_contain_any:
  - ['slot0', 'getReserves', 'balanceOf', 'getPrice', 'latestAnswer', 'latestRoundData', 'exchangeRate', 'price', 'reserves']
activate: 'yes'
output:
  title: 'GPTSCAN-PM-001: Manipulable Price Used in a Financial Operation'
  description: A financial operation depends on a price or valuation derived from potentially attacker-influenceable market or protocol state without sufficient manipulation-resistant validation.
  impact: Manipulating the pricing input may distort asset valuation or financial operation amounts, potentially causing excessive borrowing, incorrect payouts or liquidation losses. Actual exploitability and loss require further verification.
  recommendation: Use an appropriate manipulation-resistant oracle or validated time-weighted price, validate freshness and deviation where applicable, and ensure financial operations cannot rely on transient attacker-controlled state.
static:
  format: json
  prompt: |
    Identify VariableA as the variable containing attacker-influenceable pricing, reserves, balances or exchange-rate input, and VariableB as the derived valuation or amount used in the financial operation. Do not invent variables. If either cannot be identified, return N/A for that variable.
    Answer exactly {"VariableA":{"name":"description"},"VariableB":{"name":"description"}}.
  output_keys: [VariableA, VariableB]
  rule:
    name: find_data_dependency
    args: [VariableA, VariableB]
